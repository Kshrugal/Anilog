name: Deploy Firebase Profile Rules

on:
  workflow_dispatch:
    inputs:
      include_storage:
        description: Deploy profile image upload rules
        type: boolean
        default: false
      backfill_usernames:
        description: Index existing public usernames for people search
        type: boolean
        default: false

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - run: npm ci
      - name: Deploy and verify Firebase privacy rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          DEPLOY_STORAGE_RULES: ${{ inputs.include_storage }}
        run: node scripts/deploy-firebase-rules.mjs
      - name: Index existing public usernames
        if: inputs.backfill_usernames
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          CONFIRM_USERNAME_BACKFILL: anilog-10335
        run: node scripts/backfill-username-search.mjs
