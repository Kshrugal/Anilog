name: Deploy Firebase Profile Rules

on:
  workflow_dispatch:
    inputs:
      include_storage:
        description: Deploy profile image upload rules
        type: boolean
        default: false

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - run: npm ci
      - name: Deploy Firestore rules
        run: npx firebase deploy --only firestore:rules --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Deploy and verify profile image rules
        if: inputs.include_storage
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: node scripts/deploy-storage-rules.mjs
