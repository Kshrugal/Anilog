<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AniLog</title>
  <desc id="desc">AniLog — Track. Discover. Share.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1080" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1731"/>
      <stop offset=".5" stop-color="#160d2d"/>
      <stop offset="1" stop-color="#061b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="360" y1="190" x2="820" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#050505"/>
  <rect x="24" y="24" width="1152" height="582" rx="48" fill="url(#bg)" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="260" cy="160" r="150" fill="#2563eb" opacity=".18" filter="url(#glow)"/>
  <circle cx="960" cy="480" r="170" fill="#7c3aed" opacity=".2" filter="url(#glow)"/>
  <text x="600" y="305" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="142" font-weight="900" letter-spacing="-8" fill="url(#accent)">AniLog</text>
  <text x="600" y="390" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="600" letter-spacing="12" fill="#d1d5db">TRACK · DISCOVER · SHARE</text>
  <text x="600" y="492" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" fill="#9ca3af">Your anime and visual novel journey, beautifully logged.</text>
</svg>
